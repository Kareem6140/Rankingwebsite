<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accreditation – University of Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0C5A63;
    --teal-deep:#073C42;
    --teal-hover:#0a7883;
    --amber:#DE8A1B;
    --amber-light:#eaa542;
    --bg:#FCFDFD;
    --bg-alt:#F4F8F7;
    --ink:#0F1A1B;
    --muted:#5A6A6B;
    --line:#E4EAEA;
    --serif:'Outfit', system-ui, sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--serif);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;-webkit-tap-highlight-color:transparent}

  /* ==================== HERO (video + overlaid corner card) ==================== */
  .hero{
    position:relative;
    height:clamp(460px,72vh,720px);
    background:#0F1A1B;
  }
  .hero-media{
    position:absolute;inset:0;
    overflow:hidden;        /* clips the video + scrim to the hero box */
    z-index:1;
  }
  .hero video,
  .hero .video-ph{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
  }
  .hero .video-ph{
    background:
      linear-gradient(135deg, rgba(12,90,99,.5), rgba(7,60,66,.85)),
      repeating-linear-gradient(135deg,#0e2d31 0 22px,#0b2529 22px 44px);
    display:flex;align-items:center;justify-content:center;
  }
  .hero .video-ph span{
    color:rgba(255,255,255,.4);font-size:15px;letter-spacing:.08em;
    border:1px dashed rgba(255,255,255,.25);padding:14px 22px;
  }
  .hero-media::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(90deg, rgba(7,26,27,.55) 0%, rgba(7,26,27,.15) 55%, transparent 100%);
  }
  /* card straddling the video's bottom edge — half on the video, half below */
  .hero{ overflow:visible; }          /* allow the card to spill past the video */
  .hero-card{
    position:absolute;
    z-index:5;
    top:100%;                          /* anchor to the video's bottom edge */
    transform:translateY(-50%);        /* pull up so it's half above / half below */
    left:0;                            /* flush to the left edge */
    width:min(760px,72%);              /* wider, so the title runs horizontally */
    background:var(--teal);
    padding:clamp(1.5rem,3vw,2.5rem) clamp(1.75rem,3.5vw,3.25rem);
    color:#fff;
    box-shadow:0 24px 60px rgba(7,60,66,.42);
  }
  .hero-eyebrow{
    font-size:15px;letter-spacing:.24em;text-transform:uppercase;
    font-weight:700;color:var(--amber-light);
  }
  .hero-card h1{
    font-weight:700;font-size:clamp(26px,3vw,40px);
    line-height:1.08;letter-spacing:-.02em;margin:12px 0 0;
  }
  .hero-card p{
    font-size:clamp(15px,1.5vw,18px);line-height:1.7;
    color:#DCEDEB;margin:18px 0 0;
  }

  /* ==================== TOGGLE BUTTONS ==================== */
  .switch-wrap{
    padding:clamp(6rem,11vw,9rem) clamp(1.5rem,5vw,4rem) 0;
  }
  .switch-head{ text-align:center; }
  .switch-head .eyebrow{
    font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:700;color:var(--amber);
  }
  .switch-head h2{
    font-weight:700;font-size:clamp(26px,3.5vw,40px);
    letter-spacing:-.01em;line-height:1.1;margin:12px 0 28px;color:var(--ink);
  }
  .switch{
    display:flex;gap:0;flex-wrap:wrap;
    border:1px solid var(--line);
    width:fit-content;max-width:100%;
    margin:0 auto;                       /* center the toggle */
    background:#fff;
    box-shadow:0 6px 20px rgba(7,60,66,.12);
  }
  .switch button{
    font-family:var(--serif);
    font-size:clamp(16px,1.6vw,19px);font-weight:700;
    padding:20px 44px;                    /* bigger */
    border:none;background:transparent;color:var(--muted);
    cursor:pointer;position:relative;
    transition:color .3s ease, background .3s ease;
  }
  .switch button + button{border-left:1px solid var(--line)}
  .switch button:hover{color:var(--ink);background:var(--bg-alt)}
  .switch button.active{
    background:var(--teal);color:#fff;
  }
  .switch button.active::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--amber);
  }

  /* ==================== COLLEGE LIST ==================== */
  .list{
    display:flex;flex-direction:column;gap:0;
    margin-top:26px;
    border-top:1px solid var(--line);
  }
  .row{
    display:flex;align-items:stretch;
    background:#fff;
    cursor:pointer;overflow:hidden;
    border-bottom:1px solid var(--line);
    transition:background .3s ease;
  }
  .row:hover{ background:var(--bg-alt); }
  .row .thumb{
    flex:0 0 33.333%;
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:linear-gradient(135deg,#0e6e78,#073C42);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.55);font-size:13px;text-align:center;
    position:relative;
  }
  .row .thumb span{ padding:12px; }
  .row .thumb img{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease;
  }
  .row:hover .thumb img{ transform:scale(1.05); }
  .row .name{
    flex:1 1 auto;display:flex;align-items:center;
    font-size:clamp(19px,2.2vw,26px);font-weight:700;line-height:1.3;
    color:var(--ink);
    padding:0 40px;
    transition:color .25s ease, padding-left .25s ease;
  }
  .row:hover .name{ color:var(--teal); padding-left:52px; }
  .row .chev{
    flex:0 0 auto;display:flex;align-items:center;
    padding-right:40px;color:var(--amber);
    font-size:34px;line-height:1;transition:transform .25s;
  }
  .row:hover .chev{transform:translateX(6px)}

  /* list swap fade */
  .list.swapping{opacity:0;transition:opacity .2s ease}
  .list{opacity:1;transition:opacity .3s ease}

  /* ==================== FULL-SCREEN TAKEOVER ==================== */
  .stage{
    position:fixed;inset:0;display:flex;z-index:1000;
    opacity:0;visibility:hidden;
    transition:opacity .45s ease, visibility .45s ease;
  }
  .stage.open{opacity:1;visibility:visible}
  .stage-img{
    flex:0 0 30%;background:#08262b;position:relative;overflow:hidden;
    transform:translateX(-40px);
    transition:transform .55s cubic-bezier(.22,.8,.28,1);
  }
  .stage.open .stage-img{transform:translateX(0)}
  .stage-img img{width:100%;height:100%;object-fit:cover;display:block}
  .stage-img .ph{
    position:absolute;inset:0;
    background:linear-gradient(135deg,#0e6e78,#073C42);
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.6);font-size:15px;text-align:center;padding:20px;
  }
  .stage-panel{
    flex:1 1 auto;background:var(--teal);position:relative;
    padding:56px 64px 48px;overflow-y:auto;
    transform:translateX(40px);
    transition:transform .55s cubic-bezier(.22,.8,.28,1);
  }
  .stage.open .stage-panel{transform:translateX(0)}
  .close-btn{
    position:absolute;top:34px;right:44px;
    width:44px;height:44px;
    background:transparent;border:none;color:#fff;
    font-size:34px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .2s, transform .2s;
  }
  .close-btn:hover{color:var(--amber);transform:rotate(90deg)}
  .p-inner{max-width:none;opacity:0;transform:translateY(16px);
    transition:opacity .4s ease .15s, transform .4s ease .15s;}
  .stage.open .p-inner{opacity:1;transform:translateY(0)}
  .p-title{font-size:clamp(28px,3.2vw,38px);font-weight:700;letter-spacing:-.01em;line-height:1.14;color:#fff}
  .p-tag{
    display:inline-block;margin-top:14px;
    background:rgba(222,138,27,.18);color:#f4c07a;
    border:1px solid rgba(222,138,27,.6);
    padding:6px 16px;font-size:13px;font-weight:700;letter-spacing:.5px;
  }
  .p-text{margin-top:26px;font-size:17px;line-height:1.75;color:#DCEDEB}
  .p-meta{
    margin-top:36px;display:flex;gap:56px;flex-wrap:wrap;
    padding-top:26px;border-top:1px solid rgba(255,255,255,.18);
  }
  .p-meta .k{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.6);margin-bottom:8px}
  .p-meta .v{font-size:20px;font-weight:700;color:#fff}
  .p-download{
    margin-top:40px;display:inline-flex;align-items:center;gap:11px;
    background:var(--amber);color:#fff;
    padding:15px 30px;font-size:16px;font-weight:700;letter-spacing:.3px;
    transition:transform .15s, filter .15s;box-shadow:0 8px 22px rgba(222,138,27,.35);
  }
  .p-download:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .p-download svg{width:19px;height:19px;fill:currentColor}

  /* ==================== PROGRAMS: list (left) + detail (right) ==================== */
  .prog-wrap{
    margin-top:30px;
    display:grid;grid-template-columns:minmax(240px,320px) 1fr;
    column-gap:70px;align-items:start;
  }
  .prog-list{
    display:flex;flex-direction:column;
    padding-right:0;max-height:none;
  }
  .prog-list .plabel{
    font-size:13px;text-transform:uppercase;letter-spacing:1.4px;
    color:rgba(255,255,255,.5);font-weight:700;
    padding:0 0 16px 0;
  }
  .prog-item{
    position:relative;
    text-align:left;font-family:var(--serif);
    background:transparent;border:none;cursor:pointer;
    color:#B9D4D2;font-size:17px;font-weight:500;line-height:1.4;
    padding:12px 8px 12px 0;
    transition:color .28s ease, transform .28s cubic-bezier(.22,.8,.28,1);
  }
  /* thin animated underline that grows from the left on hover/active */
  .prog-item::after{
    content:"";position:absolute;left:0;bottom:6px;height:2px;
    width:0;background:var(--amber);
    transition:width .32s cubic-bezier(.22,.8,.28,1);
  }
  .prog-item:hover{color:#fff;transform:translateX(4px)}
  .prog-item:hover::after{width:22px}
  .prog-item.active{
    color:#fff;font-weight:700;transform:translateX(6px);
  }
  .prog-item.active::after{width:32px}
  .prog-detail{ padding-left:0; }
  .prog-detail .pd-name{
    font-size:clamp(24px,2.6vw,30px);font-weight:700;line-height:1.18;color:#fff;
  }
  .pd-body{
    display:inline-block;margin-top:14px;
    background:rgba(222,138,27,.18);color:#f4c07a;
    border:1px solid rgba(222,138,27,.55);
    padding:5px 14px;font-size:13.5px;font-weight:700;letter-spacing:.4px;
  }
  .pd-breif{margin-top:18px;font-size:17px;line-height:1.75;color:#DCEDEB;max-width:680px}
  .pd-section-title{
    margin-top:28px;font-size:13px;text-transform:uppercase;letter-spacing:1.4px;
    color:rgba(255,255,255,.55);font-weight:700;
  }
  .pd-standards{
    margin-top:16px;display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:44px;row-gap:11px;max-width:740px;
  }
  .pd-standards .st{
    display:flex;gap:12px;align-items:baseline;
    font-size:16px;color:#EAF4F2;line-height:1.5;
  }
  .pd-standards .st .num{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;
    font-size:12.5px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .pd-standards .st strong{color:#fff;font-weight:700}
  .pd-standards .st-group{
    grid-column:1 / -1;
    margin-top:6px;font-size:14px;font-weight:700;letter-spacing:.3px;
    color:var(--amber-light);text-transform:uppercase;
  }
  .pd-standards .st-group:first-child{margin-top:0}
  .pd-meta{
    margin-top:28px;display:flex;gap:52px;flex-wrap:wrap;
    padding-top:22px;border-top:1px solid rgba(255,255,255,.18);
  }
  .pd-meta .k{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.55);margin-bottom:8px}
  .pd-meta .v{font-size:20px;font-weight:700;color:#fff}
  .pd-empty{margin-top:24px;font-size:16px;color:rgba(255,255,255,.55);font-style:italic}
  .pd-status{
    margin-top:28px;display:inline-block;
    background:rgba(255,255,255,.08);color:#CFE6E4;
    border:1px solid rgba(255,255,255,.22);
    padding:8px 18px;font-size:14px;font-weight:600;letter-spacing:.3px;
  }

  /* fade/slide transition when switching programs */
  .prog-detail{transition:opacity .28s ease, transform .28s ease}
  .prog-detail.switching{opacity:0;transform:translateY(10px)}

  @media(max-width:800px){
    .prog-wrap{grid-template-columns:1fr;column-gap:0}
    .prog-list{
      flex-direction:row;overflow-x:auto;gap:8px;
      border-bottom:1px solid rgba(255,255,255,.16);
      padding-bottom:12px;margin-bottom:16px;
    }
    .prog-list .plabel{display:none}
    .prog-item{
      flex:0 0 auto;white-space:nowrap;
      padding:10px 14px;
    }
    .prog-item:hover,.prog-item.active{transform:none}
    .prog-item::after{bottom:2px;left:14px}
    .prog-item.active::after{width:calc(100% - 28px)}
    .prog-detail{padding-left:0;padding-top:0}
    .pd-standards{grid-template-columns:1fr}
  }

  @media(max-width:800px){
    .stage{flex-direction:column}
    .stage-img{flex:0 0 26%}
    .stage-panel{padding:32px 22px 44px}
    .hero-card{left:1rem;right:1rem;max-width:none}
    .hero-media::after{background:linear-gradient(180deg, rgba(7,26,27,.35), rgba(7,26,27,.7))}
    .row .thumb{flex-basis:42%}
    .row .name{padding:0 20px}
    .row:hover .name{padding-left:26px}
    .row .chev{padding-right:20px;font-size:26px}
    .switch{width:100%}
    .switch button{flex:1 1 auto}
  }
</style>
</head>

  function normSchool(s){
    return (s||'').toLowerCase()
      .replace(/bussiness/g,'business')
      .replace(/[^a-z0-9]+/g,' ')
      .trim();
  }
  function programsFor(name, tab){
    const src = (tab === 'under') ? UNDER_PROGRAMS_BY_SCHOOL : PROGRAMS_BY_SCHOOL;
    return src[normSchool(name)] || [];
  }

  const data = {
    international: baseList,
    under: underList,
  };
  const headings = {
    international: "Internationally Accredited Programs",
    under: "Under International Accreditation",
  };

  const list = document.getElementById('list');
  const stage = document.getElementById('stage');
  const stageImg = document.getElementById('stageImg');
  const pInner = document.getElementById('pInner');
  const listHeading = document.getElementById('listHeading');
  let current = [];
  let currentTab = 'international';

  function renderList(tab){
    currentTab = tab;
    current = data[tab];
    list.innerHTML = '';
    current.forEach((c, i)=>{
      const row = document.createElement('div');
      row.className = 'row';
      const thumb = c.image ? `<img src="${c.image}" alt="${c.name}">` : `<span>Add image</span>`;
      row.innerHTML = `
        <div class="thumb">${thumb}</div>
        <div class="name">${c.name}</div>
        <div class="chev">&rsaquo;</div>`;
      row.addEventListener('click', ()=>openStage(i));
      list.appendChild(row);
    });
  }

  /* toggle */
  document.getElementById('switch').addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    document.querySelectorAll('.switch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    listHeading.textContent = headings[tab];
    list.classList.add('swapping');
    setTimeout(()=>{ renderList(tab); list.classList.remove('swapping'); }, 200);
  });

  function esc(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g,m=>(
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Render the right-hand detail for one program object.
  // isUnder = true for "Under International Accreditation" programs, which have
  // no year, country, or certificate — so those sections are omitted.
  function renderProgramDetail(p, isUnder){
    if(!p) return `<div class="pd-empty">Select a program to see its accreditation details.</div>`;

    // Standards may be: array of strings (legacy) OR array of {type,text,label} (structured)
    let standardsHtml = '';
    if(p.standards && p.standards.length){
      let n = 0;
      const rows = p.standards.map(s=>{
        if(typeof s === 'string'){
          n++;
          return `<div class="st"><span class="num">${n}</span><span>${esc(s)}</span></div>`;
        }
        if(s.type === 'group'){
          return `<div class="st-group">${esc(s.text)}</div>`;
        }
        n++;
        const label = s.label ? `<strong>${esc(s.label)}</strong> ` : '';
        return `<div class="st"><span class="num">${n}</span><span>${label}${esc(s.text)}</span></div>`;
      }).join('');
      standardsHtml = `<div class="pd-section-title">Standards</div>
         <div class="pd-standards">${rows}</div>`;
    }

    const meta = (!isUnder && (p.year || p.accreditation_country))
      ? `<div class="pd-meta">
          ${p.year ? `<div><div class="k">Year</div><div class="v">${esc(p.year)}</div></div>`:``}
          ${p.accreditation_country ? `<div><div class="k">Country</div><div class="v">${esc(p.accreditation_country)}</div></div>`:``}
        </div>` : ``;
    const cert = (p.certificate_url && p.certificate_url !== "#")
      ? `href="${esc(p.certificate_url)}" target="_blank" rel="noopener"`
      : `href="#" onclick="return false;"`;
    const certBtn = isUnder ? `` : `
      <a class="p-download" ${cert}>
        <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
        Certificate
      </a>`;
    const statusPill = isUnder
      ? `<div class="pd-status">In progress — under international accreditation</div>` : ``;
    return `
      <h3 class="pd-name">${esc(p.program)}</h3>
      ${p.accreditation_body ? `<span class="pd-body">${esc(p.accreditation_body)}</span>`:``}
      ${p.breif ? `<p class="pd-breif">${esc(p.breif)}</p>`:``}
      ${standardsHtml}
      ${meta}
      ${statusPill}
      ${certBtn}`;
  }

  function openStage(i){
    const c = current[i];
    const progs = programsFor(c.name, currentTab);
    const isUnder = (currentTab === 'under');

    stageImg.innerHTML = c.image
      ? `<img src="${c.image}" alt="${esc(c.name)}">`
      : `<div class="ph">Add image for<br><strong>${esc(c.name)}</strong></div>`;

    if(!progs.length){
      // Fallback to the old school-level card when no program data exists
      const cert = (c.cert && c.cert !== "#") ? `href="${c.cert}" download` : `href="#" onclick="return false;"`;
      pInner.innerHTML = `
        <h2 class="p-title">${esc(c.name)}</h2>
        ${c.desc ? `<p class="p-text">${esc(c.desc)}</p>` : ``}
        ${(c.year || c.body) ? `<div class="p-meta">
          ${c.year ? `<div><div class="k">Year of Accreditation</div><div class="v">${esc(c.year)}</div></div>` : ``}
          ${c.body ? `<div><div class="k">Accrediting Body</div><div class="v">${esc(c.body)}</div></div>` : ``}
        </div>` : ``}
        <a class="p-download" ${cert}>
          <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg>
          Certificate
        </a>`;
    } else {
      pInner.innerHTML = `
        <h2 class="p-title">${esc(c.name)}</h2>
        <div class="prog-wrap">
          <div class="prog-list" id="progList">
            <div class="plabel">Programs (${progs.length})</div>
            ${progs.map((p,idx)=>
              `<button class="prog-item${idx===0?' active':''}" data-idx="${idx}">${esc(p.program)}</button>`
            ).join('')}
          </div>
          <div class="prog-detail" id="progDetail">${renderProgramDetail(progs[0], isUnder)}</div>
        </div>`;

      const detailEl = pInner.querySelector('#progDetail');
      pInner.querySelector('#progList').addEventListener('click', e=>{
        const btn = e.target.closest('.prog-item');
        if(!btn) return;
        if(btn.classList.contains('active')) return;   // already showing
        pInner.querySelectorAll('.prog-item').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        // fade out, swap, fade back in
        detailEl.classList.add('switching');
        setTimeout(()=>{
          detailEl.innerHTML = renderProgramDetail(progs[+btn.dataset.idx], isUnder);
          detailEl.scrollTop = 0;
          // next frame so the browser registers the change before removing the class
          requestAnimationFrame(()=> detailEl.classList.remove('switching'));
        }, 220);
      });
    }

    stage.classList.add('open');
    document.body.style.overflow = 'hidden';
    stage.querySelector('.stage-panel').scrollTop = 0;
  }
  function closeStage(){
    stage.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('closeBtn').addEventListener('click', closeStage);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeStage(); });

  /* initial */
  renderList('international');
</script>
</body>
</html>
