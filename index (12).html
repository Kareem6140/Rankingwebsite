document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2500\u2500 KEY PORTAL CARDS (centered + shine hover) \u2500\u2500 *\u002F\n  .portal-card{\n    position:relative; overflow:hidden;\n    text-decoration:none; display:flex; align-items:center; justify-content:center;\n    text-align:center; min-height:150px;\n    background:#0C5A63; border:1px solid #0C5A63; border-radius:0; padding:34px 28px;\n    box-shadow:0 4px 14px rgba(7,60,66,.18);\n    transition:transform .5s ease, box-shadow .5s ease, background .5s ease;\n  }\n  .portal-card .portal-title{\n    font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:24.1px;\n    line-height:1.25; color:#fff; position:relative; z-index:2;\n  }\n  .portal-card::before{\n    content:''; display:block; position:absolute; top:0; left:0;\n    width:60px; height:100%;\n    background:rgba(255,255,255,0.5);\n    opacity:.5; filter:blur(30px);\n    transform:translateX(-140px) skewX(-15deg); z-index:1; pointer-events:none;\n  }\n  .portal-card::after{\n    content:''; display:block; position:absolute; top:0; left:30px;\n    width:30px; height:100%;\n    background:rgba(255,255,255,0.25);\n    opacity:0; filter:blur(5px);\n    transform:translateX(-140px) skewX(-15deg); z-index:1; pointer-events:none;\n  }\n  .portal-card:hover{\n    transform:translateY(-5px);\n    background:#0a7883;\n    box-shadow:0 16px 36px rgba(7,60,66,.32); cursor:pointer;\n  }\n  .portal-card:hover::before{ transform:translateX(420px) skewX(-15deg); opacity:.6; transition:.7s; }\n  .portal-card:hover::after{ transform:translateX(420px) skewX(-15deg); opacity:1; transition:.7s; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<x-import component-from-global-scope=\"uj-navbar\" from=\"bf4955fd-97f7-4a30-a5e1-6e9577022682#\u002Fnav.js\" active=\"Home\" hint-size=\"100%,118px\"><\u002Fx-import>\n\n<!-- HERO -->\n<section id=\"top\" data-screen-label=\"Hero\" style=\"padding:64px; min-height:calc(100vh - 118px); display:flex; flex-direction:column; justify-content:center;\">\n  <div style=\"display:grid; grid-template-columns:1fr 1.15fr; gap:56px; align-items:center;\">\n    <div>\n      <h1 style=\"font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:59.8px; line-height:1.04; letter-spacing:-.02em; color:#0F1A1B; margin:0;\">Putting the University&nbsp;of&nbsp;Jordan on the <span style=\"background:linear-gradient(transparent 62%, #F6D79B 62%); padding:0 2px;\">global map<\u002Fspan>.<\u002Fh1>\n      <p style=\"font-size:19.5px; line-height:1.6; color:#48585A; max-width:520px; margin:24px 0 0;\">We advance UJ's standing in the world's leading university rankings and lead the pursuit of international accreditation across its schools \u2014 through rigorous data, reputation, and quality.<\u002Fp>\n      <div style=\"display:flex; gap:14px; margin-top:30px;\">\n        <a href=\"#rankings\" style=\"background:#0C5A63; color:#fff; text-decoration:none; font-weight:600; font-size:17.2px; padding:14px 26px; border-radius:0;\">View our rankings<\u002Fa>\n        <a href=\"#about\" style=\"background:#fff; color:#0F1A1B; text-decoration:none; font-weight:600; font-size:17.2px; padding:14px 26px; border-radius:0; border:1px solid #D9E1E1;\">Vision &amp; mission<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    {{ kbPanel }}\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- VISION & MISSION -->\n<section id=\"about\" data-screen-label=\"Vision and Mission\" style=\"position:relative; background:#073C42;\">\n  <div style=\"height:24px;\"><\u002Fdiv>\n  <div style=\"position:relative; z-index:3; margin-bottom:-190px; margin-left:auto; width:min(720px,75%); background:#0C5A63; padding:44px 56px 50px;\">\n    <span style=\"font-size:16.1px; letter-spacing:.24em; text-transform:uppercase; font-weight:700; color:#DE8A1B;\">Our Vision<\u002Fspan>\n    <h2 style=\"font-family:'Outfit',system-ui,sans-serif; font-size:34px; font-weight:700; color:#fff; line-height:1.12; letter-spacing:-.01em; margin:16px 0 0;\">Ranked among the world's best, <span style=\"font-style:italic; color:#eaa542;\">accredited by the finest.<\u002Fspan><\u002Fh2>\n    <p style=\"font-size:17.5px; color:#DCEDEB; line-height:1.85; margin:16px 0 0; max-width:600px;\">The University of Jordan is a beacon of academic and research excellence with local and global impact \u2014 ranked among the world's leading universities, its programs accredited by the finest international bodies.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative; height:clamp(460px,52vw,600px); overflow:hidden; background-image:url('assets\u002FHome\u002Fvision_mission_image.png'); background-size:cover; background-position:center;\"><\u002Fdiv>\n  <div style=\"position:relative; z-index:3; margin-top:-190px; width:min(720px,75%); background:#0C5A63; padding:44px 56px 50px;\">\n    <span style=\"font-size:16.1px; letter-spacing:.24em; text-transform:uppercase; font-weight:700; color:#DE8A1B;\">Our Mission<\u002Fspan>\n    <p style=\"font-size:17.5px; color:#DCEDEB; line-height:1.85; margin:16px 0 0; max-width:600px;\">We work to improve the University's reputation and enhance its global standing while advancing the sustainable development goals \u2014 managing the University's ranking file and its programs, and helping colleges secure prestigious international accreditations that promote excellence and internationality.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"height:24px;\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ACTION AREAS -->\n<section data-screen-label=\"Explore\" class=\"umbrella-section\" id=\"areas\">\n  <div class=\"umbrella-inner\">\n    <div class=\"umbrella-head reveal\">\n      <div class=\"umbrella-eyebrow\">Explore<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"area-grid\">\n      <a href=\"#rankings\" class=\"area a1\" id=\"rankings\">\n        <div class=\"bg\" style=\"background-image:url('assets\u002FHome\u002Franking.png')\"><\u002Fdiv>\n        <div class=\"area-content\">\n          <div class=\"area-pill\">\n            <div class=\"area-cat\">Recognition<\u002Fdiv>\n            <div class=\"area-title\">Rankings<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#accreditation\" class=\"area a2\" id=\"accreditation\">\n        <div class=\"bg\" style=\"background-image:url('assets\u002FHome\u002FAccreditations.png')\"><\u002Fdiv>\n        <div class=\"area-content\">\n          <div class=\"area-pill\">\n            <div class=\"area-cat\">Quality<\u002Fdiv>\n            <div class=\"area-title\">Accreditation<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#researchers\" class=\"area a3\" id=\"researchers\">\n        <div class=\"bg\" style=\"background-image:url('assets\u002FHome\u002FResearchers.png')\"><\u002Fdiv>\n        <div class=\"area-content\">\n          <div class=\"area-pill\">\n            <div class=\"area-cat\">People<\u002Fdiv>\n            <div class=\"area-title\">Researchers<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- NEWS -->\n<section data-screen-label=\"News\" style=\"padding:64px; background:#F4F8F7; border-top:1px solid #E4EAEA;\">\n  <div style=\"display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:30px;\">\n    <h2 style=\"font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:34.5px; letter-spacing:-.01em; color:#0F1A1B; margin:0;\">News &amp; announcements<\u002Fh2>\n    <a href=\"#\" style=\"text-decoration:none; color:#0C5A63; font-weight:600; font-size:16.7px;\">View all \u2192<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:1.25fr 1fr; gap:24px;\">\n    <a href=\"#\" style=\"text-decoration:none; display:block; background:#fff; border:1px solid #E4EAEA; border-radius:0; overflow:hidden;\">\n      <div style=\"height:230px; background:repeating-linear-gradient(135deg,#E9F1F0 0 11px,#E1EBEA 11px 22px); display:flex; align-items:center; justify-content:center;\"><span style=\"font-family:'Outfit',system-ui,sans-serif; font-size:14.4px; letter-spacing:.05em; color:#8AA09F;\">[ award \u00b7 campus photo ]<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:26px;\">\n        <div style=\"display:flex; gap:10px; align-items:center; font-size:14.4px; color:#5A6A6B;\"><span style=\"background:#0C5A63; color:#fff; font-weight:600; padding:3px 10px; border-radius:0;\">Ranking<\u002Fspan><span>March 2025<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:26.4px; line-height:1.2; color:#0F1A1B; margin-top:14px;\">UJ ranks first nationally in the 2025 U.S. News &amp; World Report Best Global Universities<\u002Fdiv>\n        <p style=\"font-size:16.7px; line-height:1.6; color:#5A6A6B; margin:12px 0 0;\">A milestone built entirely on research performance, scientific reputation and output across disciplines.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fa>\n    <div style=\"display:flex; flex-direction:column; gap:14px;\">\n      <a href=\"#\" style=\"text-decoration:none; display:block; background:#fff; border:1px solid #E4EAEA; border-radius:0; padding:20px 22px;\">\n        <div style=\"font-size:13.8px; color:#9AA8A8;\">QS 2026<\u002Fdiv>\n        <div style=\"font-family:'Outfit',system-ui,sans-serif; font-weight:600; font-size:19px; line-height:1.3; color:#0F1A1B; margin-top:6px;\">UJ enters the QS World University Rankings 2026 at #324, within the global top 350.<\u002Fdiv>\n      <\u002Fa>\n      <a href=\"#\" style=\"text-decoration:none; display:block; background:#fff; border:1px solid #E4EAEA; border-radius:0; padding:20px 22px;\">\n        <div style=\"font-size:13.8px; color:#9AA8A8;\">Subjects<\u002Fdiv>\n        <div style=\"font-family:'Outfit',system-ui,sans-serif; font-weight:600; font-size:19px; line-height:1.3; color:#0F1A1B; margin-top:6px;\">Eight subjects debut in QS rankings, including Data Science &amp; Artificial Intelligence.<\u002Fdiv>\n      <\u002Fa>\n      <a hr ditation<\u002Fdiv>\n      <div style=\"font-size:15.5px; line-height:1.6; margin-top:10px; color:#9FC2C0;\">The University of Jordan \u00b7 Amman 11942, Jordan<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:56px; font-size:16.1px;\">\n      <div style=\"display:flex; flex-direction:column; gap:10px;\"><span style=\"color:#fff; font-weight:600; margin-bottom:2px;\">Office<\u002Fspan><a href=\"#about\" style=\"color:#BFD8D6; text-decoration:none;\">About Us<\u002Fa><a href=\"#sustainability\" style=\"color:#BFD8D6; text-decoration:none;\">Sustainability Office<\u002Fa><a href=\"#contact\" style=\"color:#BFD8D6; text-decoration:none;\">Contact Us<\u002Fa><\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px;\"><span style=\"color:#fff; font-weight:600; margin-bottom:2px;\">Resources<\u002Fspan><a href=\"#rankings\" style=\"color:#BFD8D6; text-decoration:none;\">Rankings<\u002Fa><a href=\"#accreditation\" style=\"color:#BFD8D6; text-decoration:none;\">Accreditation<\u002Fa><a href=\"#researchers\" style=\"color:#BFD8D6; text-decoration:none;\">Researchers<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"height:1px; background:rgba(255,255,255,.12); margin:30px 0 18px;\"><\u002Fdiv>\n  <div style=\"font-size:14.4px; color:#86A8A6;\">\u00a9 2026 The University of Jordan. All rights reserved.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { slide: 0 };\n\n  componentDidMount() {\n    this._t = setInterval(\n      () => this.setState(s => ({ slide: (s.slide + 1) % 4 })),\n      5000\n    );\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._t);\n  }\n\n  renderVals() {\n    const { slide } = this.state;\n    const AMBER = '#DE8A1B';\n\n    const slides = [\n      {\n        rank: '#543', cat: 'International Research Network', badge: 'QS 2026',\n        bg: 'repeating-linear-gradient(135deg,#1C3935 0 14px,#172F2B 14px 28px)',\n        label: '[ lab \u00b7 research photo ]', anim: 'kb0 10s ease-in-out infinite alternate',\n      },\n      {\n        rank: '#309', cat: 'International Students', badge: 'QS 2026',\n        bg: 'repeating-linear-gradient(120deg,#182E1E 0 14px,#152A1B 14px 28px)',\n        label: '[ students \u00b7 campus life ]', anim: 'kb1 10s ease-in-out infinite alternate',\n      },\n      {\n        rank: '#420', cat: 'Sustainability', badge: 'QS 2026',\n        bg: 'repeating-linear-gradient(145deg,#0D2535 0 14px,#0B2030 14px 28px)',\n        label: '[ aerial \u00b7 solar campus ]', anim: 'kb2 10s ease-in-out infinite alternate',\n      },\n      {\n        rank: '#35', cat: 'Nursing \u2014 Worldwide', badge: 'QS Subjects 2026',\n        bg: 'repeating-linear-gradient(130deg,#2B2214 0 14px,#261E11 14px 28px)',\n        label: '[ nursing \u00b7 medical photo ]', anim: 'kb3 10s ease-in-out infinite alternate',\n      },\n    ];\n\n    const e = React.createElement;\n\n    const kbPanel = e('div', {\n      style: {\n        position: 'relative', borderRadius: '0', overflow: 'hidden',\n        height: 'clamp(480px, 62vh, 640px)', width: '100%', background: '#0F1A1B',\n      },\n    },\n      ...slides.map((s, i) =>\n        e('div', {\n          key: i,\n          style: {\n            position: 'absolute', inset: 0,\n            opacity: i === slide ? 1 : 0,\n            transition: 'opacity 1.3s ease',\n          },\n        },\n          e('div', {\n            style: {\n              position: 'absolute', inset: '-8%',\n              background: s.bg,\n              animation: s.anim,\n            },\n          },\n            e('span', {\n              style: {\n                position: 'absolute', top: '50%', left: '50%',\n                transform: 'translate(-50%,-50%)',\n                fontFamily: \"'Outfit', sans-serif\",\n                fontSize: '13.8px', letterSpacing: '.07em',\n                color: 'rgba(255,255,255,.2)', whiteSpace: 'nowrap', userSelect: 'none',\n              },\n            }, s.label)\n          ),\n          e('div', {\n            style: {\n              position: 'absolute', inset: 0,\n              background: 'linear-gradient(to top, rgba(7,60,66,.97) 0%, rgba(7,60,66,.3) 50%, transparent 75%)',\n            },\n          }),\n          e('div', {\n            style: {\n              position: 'absolute', bottom: 0, left: 0, right: 0,\n              padding: '32px 36px',\n              opacity: i === slide ? 1 : 0,\n              transform: i === slide ? 'translateY(0)' : 'translateY(14px)',\n              transition: 'opacity .9s ease .6s, transform .9s ease .6s',\n            },\n          },\n            e('div', {\n              style: { display: 'flex', alignItems: 'center', gap: '13px', marginBottom: '14px' },\n            },\n              e('div', {\n                style: {\n                  width: '46px', height: '46px', borderRadius: '0', flexShrink: 0,\n                  background: 'linear-gradient(135deg,#DE8A1B,#AD6209)',\n                  display: 'flex', alignItems: 'center', justifyContent: 'center',\n                  fontSize: '9.2px', fontWeight: '700', color: '#fff',\n                  textAlign: 'center', lineHeight: '1.25', padding: '5px',\n                  fontFamily: \"'Outfit',sans-serif\",\n                  border: '2px solid rgba(255,255,255,.28)',\n                  whiteSpace: 'pre-line',\n                },\n              }, 'TOP\\n350\\nWORLD'),\n              e('span', {\n                style: {\n                  fontSize: '14.4px', fontWeight: '600', letterSpacing: '.13em',\n                  textTransform: 'uppercase', color: '#9FC9C6',\n                  fontFamily: \"'Outfit',sans-serif\",\n                },\n              }, s.badge)\n            ),\n            e('div', {\n              style: {\n                fontFamily: \"'Outfit',sans-serif\",\n                fontWeight: '700', fontSize: '87.4px', lineHeight: '.92',\n                color: '#fff', letterSpacing: '-.025em',\n              },\n            }, s.rank),\n            e('div', {\n              style: {\n                fontFamily: \"'Outfit',sans-serif\",\n                fontSize: '20.7px', fontWeight: '500', color: '#9FC9C6',\n                marginTop: '11px',\n              },\n            }, s.cat)\n          )\n        )\n      ),\n      e('div', {\n        style: {\n          position: 'absolute', bottom: '22px', right: '24px',\n          display: 'flex', gap: '7px', zIndex: 10,\n        },\n      },\n        ...slides.map((_, i) =>\n          e('button', {\n            key: i,\n            onClick: () => this.setState({ slide: i }),\n            style: {\n              width: i === slide ? '24px' : '6px',\n              height: '6px', borderRadius: '0',\n              background: i === slide ? AMBER : 'rgba(255,255,255,.3)',\n              border: 'none', cursor: 'pointer',\n              transition: 'all .35s ease', padding: 0,\n            },\n          })\n        )\n      )\n    );\n\n    return { kbPanel };\n  }\n}\n<\u002Fscript>\n\n<script>\n  \u002F\u002F Reveal-on-scroll for the Explore section (ported from index).\n  (function () {\n    function wire() {\n      var els = document.querySelectorAll('.umbrella-section .reveal:not(.in)');\n      if (!els.length) return false;\n      if (!('IntersectionObserver' in window)) {\n        els.forEach(function (el) { el.classList.add('in'); });\n        return true;\n      }\n      var io = new IntersectionObserver(function (entries) {\n        entries.forEach(function (e) {\n          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }\n        });\n      }, { threshold: .12 });\n      els.forEach(function (el) { io.observe(el); });\n      return true;\n    }\n    \u002F\u002F The framework renders asynchronously, so retry until the nodes exist.\n    if (!wire()) {\n      var tries = 0;\n      var iv = setInterval(function () {\n        if (wire() || ++tries > 40) clearInterval(iv);\n      }, 100);\n    }\n  })();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
